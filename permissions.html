<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PaceMeter — Microphone Check</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0F172A; color: #F8FAFC; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { max-width: 440px; padding: 28px; border: 1px solid #1E293B; border-radius: 12px; background: #111827; }
    h1 { font-size: 20px; margin-bottom: 10px; }
    p { font-size: 14px; color: #94A3B8; line-height: 1.6; margin-bottom: 18px; }
    button { background: #0284C7; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
    #status { margin-top: 14px; font-size: 13px; color: #34D399; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Verify Local Microphone Access</h1>
    <p>PaceMeter processes your voice 100% locally in your browser using Web Audio API. No audio is ever uploaded or recorded to any server.</p>
    <button id="check-btn">Allow & Test Microphone</button>
    <div id="status"></div>
  </div>
  <script src="permissions.js"></script>
</body>
</html>
